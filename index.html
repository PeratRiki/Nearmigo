<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nearmigo — Opportunities near you</title>
  <meta
    name="description"
    content="Discover nearby events, internships and workshops for your interests."
  >

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase library -->
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <!-- Our application -->
  <script defer src="./script.js"></script>
</head>

<body class="min-h-screen bg-white font-sans text-slate-900 antialiased">
  <main class="mx-auto max-w-lg px-5 pb-8 pt-7 sm:px-8 sm:pt-10">

    <header class="mb-10">
      <a
        href="./index.html"
        class="text-2xl font-bold tracking-tight text-blue-600"
        aria-label="Nearmigo home"
      >
        Nearmigo
      </a>
    </header>

    <section aria-labelledby="page-title">
      <h1
        id="page-title"
        class="max-w-sm text-3xl font-bold leading-tight tracking-tight sm:text-4xl"
      >
        Find opportunities<br>
        near you
      </h1>

      <p class="mt-3 text-base leading-relaxed text-slate-500">
        Events, internships and workshops for you.
      </p>

      <form id="search-form" class="mt-7 space-y-4">
        <div>
          <label
            for="profession"
            class="mb-2 block text-sm font-semibold"
          >
            Your profession or interests
          </label>

          <input
            id="profession"
            name="profession"
            type="text"
            placeholder="Enter Your Profession"
            maxlength="200"
            class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-base outline-none placeholder:text-slate-400 focus:border-blue-600 focus:ring-2 focus:ring-blue-100"
          >
        </div>

        <div>
          <label
            for="city"
            class="mb-2 block text-sm font-semibold"
          >
            City
          </label>

          <select
            id="city"
            name="city"
            class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-base outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100"
          >
            <option value="" selected>All cities</option>
            <option value="Skopje">Skopje</option>
            <option value="Kavadarci">Kavadarci</option>
            <option value="Bitola">Bitola</option>
            <option value="Ohrid">Ohrid</option>
            <option value="Tetovo">Tetovo</option>
            <option value="Stip">Stip</option>
          </select>
        </div>

        <button
          id="search-button"
          type="submit"
          class="min-h-[48px] w-full rounded-lg bg-blue-600 px-4 py-3 font-semibold text-white transition hover:bg-blue-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:cursor-wait disabled:opacity-60"
        >
          Find opportunities
        </button>
      </form>
    </section>

    <section class="mt-5" aria-label="Filter opportunities">
      <div class="flex flex-wrap gap-2">
        <button
          type="button"
          data-category="all"
          aria-pressed="true"
          class="rounded-lg border border-blue-600 bg-blue-600 px-3 py-2 text-sm font-medium text-white"
        >
          All
        </button>

        <button
          type="button"
          data-category="event"
          aria-pressed="false"
          class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm font-medium text-slate-600"
        >
          Events
        </button>

        <button
          type="button"
          data-category="internship"
          aria-pressed="false"
          class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm font-medium text-slate-600"
        >
          Internships
        </button>

        <button
          type="button"
          data-category="workshop"
          aria-pressed="false"
          class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm font-medium text-slate-600"
        >
          Workshops
        </button>
      </div>
    </section>

    <section class="mt-7" aria-labelledby="results-title">
      <div class="flex items-center justify-between gap-3">
        <h2 id="results-title" class="text-xl font-bold">
          For you
        </h2>

        <span id="result-count" class="text-sm text-slate-500"></span>
      </div>

      <p
        id="status"
        role="status"
        aria-live="polite"
        class="mt-2 text-sm leading-relaxed text-slate-500"
      ></p>

      <div
        id="results"
        class="mt-2 divide-y divide-slate-200"
        aria-busy="false"
      ></div>

      <div
        id="empty-state"
        hidden
        class="py-10 text-center"
      >
        <p class="font-semibold">No opportunities found</p>
        <p class="mt-2 text-sm text-slate-500">
          Try another interest, city or category.
        </p>
      </div>
    </section>

    <footer class="mt-8 border-t border-slate-200 pt-5 text-center">
      <p class="text-sm text-slate-400">
        Nearmigo — Your next opportunity is nearby.
      </p>
    </footer>
  </main>

  <dialog
    id="map-dialog"
    class="w-[min(92vw,42rem)] max-w-none rounded-lg p-0 shadow-xl backdrop:bg-slate-900/60"
    aria-labelledby="map-dialog-title"
  >
    <div class="flex items-center justify-between gap-4 border-b border-slate-200 px-4 py-3">
      <h2 id="map-dialog-title" class="font-semibold">Event location</h2>
      <button
        id="map-dialog-close"
        type="button"
        class="min-h-11 rounded px-3 text-sm font-medium text-slate-600 hover:bg-slate-100"
        aria-label="Close map preview"
      >
        Close
      </button>
    </div>
    <iframe
      id="map-preview"
      class="block aspect-[4/3] w-full border-0 sm:aspect-video"
      title="Google Maps preview of the event location"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
    <div class="border-t border-slate-200 px-4 py-3">
      <a
        id="map-open-link"
        class="text-sm font-medium text-blue-600 hover:underline"
        target="_blank"
        rel="noopener noreferrer"
      >
        Open in Google Maps
      </a>
    </div>
  </dialog>
</body>
</html>
